<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 보기</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#1c1a17; --panel:#22201d; --card:#2b2824; --line:#3a362f; --ink:#efe9e0; --sub:#a89f92; --dim:#8f867a;
          --acc:#9db4ff; --acc2:#5b6fb8; --read:#7fb2ff; --write:#e0b25a; --ok:#7fd8bd; --warn:#e0b25a; --bad:#ff8f8f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif; font-size:13px; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; padding:12px 20px; border-bottom:1px solid var(--line); }
  .dev { font-size:11px; padding:3px 8px; border-radius:4px; background:var(--acc); color:#14161f; }
  h1 { margin:0; font-size:17px; }
  .proj { color:var(--sub); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .chip { display:flex; align-items:center; gap:6px; min-height:34px; padding:0 12px; border:1px solid var(--line); border-radius:17px; background:var(--card); }
  .chip b { font-size:15px; }
  .chip.sel { border-color:var(--acc); background:#262c4a; }
  .chip.warn b { color:var(--warn); }
  input[type=search] { min-height:34px; padding:0 12px; border:1px solid var(--line); border-radius:17px; background:var(--card); color:var(--ink); width:200px; }
  .tabs { display:flex; gap:4px; padding:10px 20px 0; }
  .tab { padding:8px 14px; border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; background:var(--panel); color:var(--sub); }
  .tab.on { background:var(--card); color:var(--ink); border-color:var(--acc2); }
  main { display:flex; height:calc(100% - 118px); }
  .view { flex:1; min-width:0; overflow:auto; border-top:1px solid var(--line); }
  aside { width:480px; flex:none; overflow:auto; border-left:1px solid var(--line); background:var(--panel); padding:16px; }
  table { border-collapse:separate; border-spacing:0; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  .matrix th.col { position:sticky; top:0; background:var(--panel); z-index:2; font-weight:500; color:var(--sub); font-size:11px; min-width:74px; text-align:center; }
  .matrix td.name, .matrix th.name { position:sticky; left:0; background:var(--panel); z-index:1; min-width:230px; max-width:230px; }
  .matrix th.name { z-index:3; top:0; }
  .matrix tr.row { cursor:pointer; }
  .matrix tr.row:hover td { background:#262320; }
  .matrix tr.row.sel td { background:#262c4a; }
  .matrix td.cell { text-align:center; white-space:nowrap; }
  .tagr, .tagw, .tagu { display:inline-block; font-size:11px; padding:1px 5px; border-radius:4px; margin:0 1px; }
  .tagr { border:1px solid var(--read); color:var(--read); }
  .tagw { border:1px solid var(--write); color:var(--write); }
  .tagu { border:1px solid var(--dim); color:var(--dim); }
  .nm { font-weight:700; }
  .kind { font-size:10px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:6px; }
  .flag { color:var(--warn); font-size:11px; margin-left:6px; }
  h2 { margin:0 0 4px; font-size:18px; }
  .where { color:var(--sub); font-size:12px; }
  .doc { margin:12px 0; padding:10px 12px; border-radius:8px; background:var(--card); line-height:1.6; white-space:pre-wrap; }
  .doc.none { color:var(--warn); border:1px dashed #5a4a22; background:none; }
  .props th { color:var(--sub); font-size:11px; font-weight:500; }
  .pname { font-weight:700; }
  .ptype { color:var(--dim); font-size:11px; max-width:150px; overflow-wrap:anywhere; }
  .st { font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid; white-space:nowrap; }
  .st.rw { color:var(--ok); border-color:var(--ok); }
  .st.part { color:var(--warn); border-color:var(--warn); }
  .st.none { color:var(--bad); border-color:var(--bad); }
  .evi { margin-top:4px; font-size:11px; color:var(--sub); line-height:1.5; }
  .evi .maybe { color:var(--warn); }
  .where2 { color:var(--sub); font-size:11px; }
  .empty { padding:40px; color:var(--sub); }
  .list td.num { text-align:right; }
</style>
</head>
<body>
<header>
  <span class="dev mono">DEV</span><h1>정보 보기</h1><span class="proj mono" id="proj"></span>
  <input type="search" id="q" placeholder="정보 이름 검색">
  <div class="chips" id="chips"></div>
</header>
<div class="tabs"><button class="tab on" data-v="matrix">정보 × 영역</button><button class="tab" data-v="list">정보 목록</button></div>
<main><div class="view" id="view"></div><aside id="detail"><div class="empty">왼쪽에서 정보를 고르세요.</div></aside></main>
<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let D = null, view = 'matrix', sel = null, onlyFlag = false, withUnused = false, q = '';
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
const needs = (i) => i.props.some((p) => p.status !== 'rw');

async function load(re) {
  $('#view').replaceChildren(el('div', 'empty', re ? '다시 분석 중… (큰 프로젝트는 30초 안팎)' : '불러오는 중…'));
  const r = await fetch(re ? '/api/reanalyze' : '/api/info.json', { cache: 'no-store' });
  D = await r.json();
  $('#proj').textContent = D.project;
  render();
}

function visible() {
  return D.infos.filter((i) => (withUnused || i.external > 0) && (!onlyFlag || needs(i)) && (!q || i.name.toLowerCase().includes(q.toLowerCase())));
}

function renderChips() {
  const c = $('#chips'); c.replaceChildren();
  const used = D.infos.filter((i) => i.external > 0);
  const add = (label, n, cls, on, fn) => { const b = el('button', `chip ${cls || ''} ${on ? 'sel' : ''}`); b.append(el('span', null, label), el('b', 'mono', String(n))); b.onclick = fn; c.append(b); };
  add('정보', used.length, '', false, () => {});
  add('확인 필요', used.filter(needs).length, 'warn', onlyFlag, () => { onlyFlag = !onlyFlag; render(); });
  add('미사용 포함', D.infos.length - used.length, '', withUnused, () => { withUnused = !withUnused; render(); });
  const b = el('button', 'chip'); b.append(el('span', null, '다시 분석')); b.onclick = () => load(true); c.append(b);
}

function matrixView(rows) {
  const t = el('table', 'matrix');
  const areas = D.areas.filter((a) => rows.some((i) => cellOf(i, a)));
  const hr = el('tr'); hr.append(el('th', 'name', '정보')); areas.forEach((a) => hr.append(el('th', 'col', a))); t.append(hr);
  for (const i of rows) {
    const tr = el('tr', `row ${sel === i.id ? 'sel' : ''}`);
    const nm = el('td', 'name'); nm.append(el('span', 'nm', i.name), el('span', 'kind', i.kind));
    const nf = i.props.filter((p) => p.status !== 'rw').length; if (nf) nm.append(el('span', 'flag', `확인 ${nf}`));
    tr.append(nm);
    for (const a of areas) {
      const td = el('td', 'cell'); const c = cellOf(i, a);
      if (c) { if (c.r) td.append(el('span', 'tagr mono', `읽 ${c.r}`)); if (c.w) td.append(el('span', 'tagw mono', `쓰 ${c.w}`)); if (!c.r && !c.w && c.u) td.append(el('span', 'tagu mono', `사용 ${c.u}`)); }
      tr.append(td);
    }
    tr.onclick = () => { sel = i.id; render(); };
    t.append(tr);
  }
  return t;
}
function cellOf(i, a) {
  let r = 0, w = 0; for (const p of i.props) { r += p.reads[a] || 0; w += p.writes[a] || 0; }
  const u = i.typeAreas[a] || 0; return r || w || u ? { r, w, u } : null;
}

function listView(rows) {
  const t = el('table', 'list');
  const hr = el('tr'); ['정보', '종류', '쓰는 파일', '필드', '확인 필요', '존재 이유'].forEach((h) => hr.append(el('th', null, h))); t.append(hr);
  for (const i of rows) {
    const tr = el('tr', `row ${sel === i.id ? 'sel' : ''}`); tr.style.cursor = 'pointer';
    tr.append(el('td', 'nm', i.name), el('td', null, i.kind), el('td', 'num mono', String(i.external)), el('td', 'num mono', String(i.props.length)), el('td', 'num mono', String(i.props.filter((p) => p.status !== 'rw').length)), el('td', null, i.doc ? '있음' : '없음'));
    tr.onclick = () => { sel = i.id; render(); }; t.append(tr);
  }
  return t;
}

const ST = { rw: ['읽기·쓰기', 'rw'], 'read-only': ['읽기만', 'part'], 'write-only': ['쓰기만', 'part'], none: ['쓰임 없음', 'none'] };
const fmt = (o) => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(' · ') || '-';

function detailView() {
  const d = $('#detail'); d.replaceChildren();
  const i = D.infos.find((x) => x.id === sel);
  if (!i) { d.append(el('div', 'empty', '왼쪽에서 정보를 고르세요.')); return; }
  d.append(el('h2', null, i.name), el('div', 'where mono', `${i.kind} · ${i.file}:${i.line}`));
  d.append(i.doc ? el('div', 'doc', i.doc) : el('div', 'doc none', '존재 이유 주석 없음 — 이 정보가 왜 있는지 소스에 적혀 있지 않다'));
  d.append(el('div', 'where', `쓰는 영역: ${fmt(i.typeAreas)}`));
  if (!i.props.length) { d.append(el('div', 'empty', i.kind === 'type' ? '필드가 없는 타입(값의 모음 등)' : '필드 없음')); return; }
  const t = el('table', 'props'); const hr = el('tr'); ['필드', '읽는 곳', '쓰는 곳', '상태'].forEach((h) => hr.append(el('th', null, h))); t.append(hr);
  for (const p of i.props) {
    const tr = el('tr'); const n = el('td'); n.append(el('div', 'pname mono', p.name + (p.optional ? '?' : '')), el('div', 'ptype mono', p.type));
    const s = el('td'); const [label, cls] = ST[p.status];
    s.append(el('span', `st ${cls}`, label));
    if (p.status !== 'rw') {
      const ev = el('div', 'evi');
      if (p.maybe) {
        ev.append(el('div', 'maybe', '후보 — 같은 이름이 다른 곳에도 있어 실제로는 쓰일 수 있다'));
        if (p.evidence.dupTotal) { ev.append(el('div', null, `다른 정의 ${p.evidence.dupTotal}곳:`)); p.evidence.dups.forEach((x) => ev.append(el('div', 'mono', `· ${x.owner} (${x.file}:${x.line}) ${x.type}`))); }
        if (p.evidence.strs.length) { ev.append(el('div', null, '문자열로 쓰인 곳:')); p.evidence.strs.forEach((x) => ev.append(el('div', 'mono', `· ${x.file}:${x.line}`))); }
      } else ev.append(el('div', null, '확정 — 다른 정의나 문자열에서도 찾지 못함'));
      s.append(ev);
    }
    tr.append(n, el('td', 'where2', fmt(p.reads)), el('td', 'where2', fmt(p.writes)), s); t.append(tr);
  }
  d.append(t);
}

function render() {
  if (!D) return;
  renderChips();
  const rows = visible();
  const v = $('#view'); v.replaceChildren(rows.length ? (view === 'matrix' ? matrixView(rows) : listView(rows)) : el('div', 'empty', '조건에 맞는 정보가 없다'));
  detailView();
}
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b)); render(); });
$('#q').oninput = (e) => { q = e.target.value; render(); };
load(false);
</script>
</body>
</html>
